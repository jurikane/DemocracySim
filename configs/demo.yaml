model:
  # seed: 42  # Run SEED (optional)
  num_agents: 50
  num_colors: 4
  rule_idx: 1
  distance_idx: 0
  election_impact_on_mutation: 1.5
  mu: 0.1

  # Elections
  election_cost_rate: 0.01  # As fraction of common assets
  reward_rate_personal: 0.02
  break_even_distance_common: 0.4 # Quality threshold for the mode-aware quality_distance gate
  quality_target_mode: puzzle
  puzzle_local_kappa: 90.0
  puzzle_shock_prob: 0.05

  # Voting Agents
  num_personality_groups: 4
  known_cells: 3

  # Grid parameters
  height: 10
  width: 50
  color_patches_steps: 3
  patch_power: 1.0
  heterogeneity: 0.3

  # Voting Areas
  num_areas: 2
  av_area_height: 10
  av_area_width: 25
  area_size_variance: 0.0

  # Adaptive participation learning
  participation_alpha: 0.1
  participation_beta: 5.0
  participation_init_q: 0.1
  participation_q_max: 2.0
  # EMA alpha for participation baseline (1.0 => baseline becomes last step's value)
  participation_baseline_alpha: 0.1
  participation_signal_mode: group_relative_delta_rel_party
  participation_signal_fee_weight: 1.0
  participation_signal_group_shrink_k: 3.0
  participation_signal_clip: 0.25

  # Per-agent personal preference shape (static)
  personal_preference_peakedness: 1.0

  # Adaptive altruism learning (reality-weight)
  altruism_alpha: 0.05
  altruism_init: 0.5
  altruism_clip_min: 0.0
  altruism_clip_max: 1.0
  # Altruism mode: static | surprise_learning | satisfaction
  altruism_mode: satisfaction
  # Satisfaction mode response smoothing (1.0 => direct mapping to sigmoid target)
  altruism_response_gamma: 0.8
  # Satisfaction mode sigmoid target = sigmoid(k * (satisfaction - theta))
  altruism_satisfaction_theta: 0.6
  altruism_satisfaction_slope: 7.0
  # Legacy compatibility flag (ignored when altruism_mode is set)
  altruism_learning: false
  altruism_static: 0.5
  # Satisfaction value (learning signal stub; used by altruism learning)
  satisfaction_mode: area
  # EMA alpha for baseline (1.0 => baseline becomes last step's value)
  satisfaction_baseline_alpha: 0.1

visualization:
  cell_size: 17
  draw_borders: true
  show_area_stats: false
  calibration_mode: false
  show_agent_debug_panel: false
  agent_debug_area_id: null
  agent_debug_max_steps: 1
  agent_debug_max_agents: 50
  agent_debug_max_field_len: 180

simulation:  # Config for headless runs
  runs: 1
  num_steps: 150
  store_grid: true
  grid_interval: 1
  base_seed: 0  # Determines model seeds per run
