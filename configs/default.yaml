model:
  # Elections
  election_cost_rate: 0.01  # In percent of common assets
  reward_rate_common: 0.02
  reward_rate_personal: 0.02
  reward_threshold_common: 0.25
  reward_threshold_personal: 0.25
  abstention_share: 1.0
  election_impact_on_mutation: 1.8
  mu: 0.05
  rule_idx: 0
  distance_idx: 1

  # Model parameters
  num_agents: 300
  common_assets: 15000
  num_colors: 3
  color_patches_steps: 3
  patch_power: 1.0
  heterogeneity: 0.3
  known_cells: 10
  # seed: 42 (optional))

  # Voting Agents
  num_personality_groups: 4

  # Grid parameters
  height: 80
  width: 100

  # Voting Areas
  num_areas: 16
  av_area_height: 20
  av_area_width: 25
  area_size_variance: 0.0

  # Adaptive participation learning
  participation_alpha: 0.05
  participation_beta: 1.0
  participation_init_q: 0.0
  participation_q_max: 50.0
  bias_toward_participation: 0.25

  # Per-agent personal_opt_dist (static)
  personal_opt_dist_concentration: 1.0

  # Adaptive altruism learning (reality-weight)
  altruism_alpha: 0.05
  altruism_init: 0.5
  altruism_clip_min: 0.0
  altruism_clip_max: 1.0
  altruism_learning: false
  altruism_static: 0.5
  # Satisfaction value (learning signal stub; used by altruism learning)
  satisfaction_mode: area
  # EMA alpha for baseline (1.0 => baseline becomes last step's value)
  satisfaction_baseline_alpha: 0.1

visualization:
  cell_size: 10
  draw_borders: true
  show_area_stats: false
  calibration_mode: false
  show_agent_debug_panel: false
  agent_debug_area_id: null
  agent_debug_max_steps: 1
  agent_debug_max_agents: 50
  agent_debug_max_field_len: 180

simulation:  # Config for headless runs
  runs: 3
  num_steps: 200
  processes: 8
  store_grid: true
  grid_interval: 1
  base_seed: 42  # Determines model seeds per run
