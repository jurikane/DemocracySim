[tool.poetry]
name = "DemocracySim"
version = "0.1.0"
description = "Simulated Multi-Agent Democracy for thesis experiments"
authors = ["Paul Kühnel"]
readme = "README.md"
license = "MIT"
keywords = [
    "ABM",
    "multi-agent simulation",
    "Mesa",
    "collective intelligence",
    "computational social choice",
    "simulated democracy"
]
homepage = "https://github.com/jurikane/participation"
repository = "https://github.com/jurikane/participation"
python = "^3.11"

[tool.poetry.dependencies]
python = "^3.11"
mesa = "2.3.0"
mesa-replay = { git = "https://github.com/Logende/mesa-replay.git", rev = "main" }
numpy = "1.26.4"
pandas = "2.2.2"
matplotlib = "3.9.0"
seaborn = "0.13.2"
solara = "1.44.1"
ipyvuetify = "1.9.4"
click = "8.1.7"
networkx = "3.3"
flask = "3.0.3"
altair = "5.3.0"
streamlit = "1.37.1"
pydantic = "2.11.9"
pydantic-core = "2.33.2"
annotated-types = ">=0.6.0"
typing-inspection = ">=0.4.0"
PyYAML = "6.0.3"
toml = "0.10.2"
tornado = ">=6.5.2,<7"
pytest = "8.2.0"
pytest-cov = "5.0.0"
iniconfig = "*"
pluggy = ">=1.5,<2.0"
black = "24.3.0"
mypy = "1.5.1"
toolz = "1.0.0"
blinker = ">=1.0.0,<2"
gitpython = "!=3.1.19,<4,>=3.0.7"
protobuf = ">=3.20,<6"
pyarrow = ">=7.0"
pydeck = ">=0.8.0b4,<1"
tenacity = ">=8.1.0,<9"

[tool.poetry.dev-dependencies]
pytest = "8.2.0"
pytest-cov = "5.0.0"
black = "24.3.0"
mypy = "1.5.1"
mkdocs = "1.6.0"
mkdocs-material = "9.5.25"
mkdocs-autorefs = "1.3.0"
mkdocs-get-deps = "0.2.0"
mkdocs-git-revision-date-localized-plugin = "0.9.3"
mkdocs-material-extensions = "1.3.1"
mkdocs-static-i18n = "1.2.3"
mkdocstrings = "0.27.0"
mkdocstrings-python = "1.13.0"

[tool.poetry.include]
"DemocracySim/configs/*.yaml" = "DemocracySim/configs"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
